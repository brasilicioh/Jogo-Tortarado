<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>Jogo-Tortarado</title>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

		<style>
			:root {
				background: #000;
				font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				height: 100dvh;
				margin: 0;
				overflow: hidden;
				background: #000;
			}

			body {
				display: grid;
				place-items: center;
				touch-action: none;
			}

			#canvas {
				display: block;
				width: 100%;
				height: 100%;
				margin: 0;
				border: 0;
				outline: none;
				background: #000;
			}

			#status {
				position: fixed;
				inset: 0;
				z-index: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				box-sizing: border-box;
				padding: 1rem;
				background: #242424;
				color: #e0e0e0;
				text-align: center;
				visibility: hidden;
			}

			#status-splash {
				max-width: 100%;
				max-height: 100%;
				object-fit: contain;
			}

			#status-splash.show-image--false {
				display: none;
			}

			#status-splash.fullsize--true {
				width: 100%;
				height: 100%;
			}

			#status-splash.use-filter--false {
				image-rendering: pixelated;
			}

			#status-progress {
				width: min(50%, 24rem);
				margin-top: 1rem;
			}

			#status-notice {
				max-width: 38rem;
				padding: 1rem;
				border: 1px solid #9b3943;
				border-radius: 0.5rem;
				background: #5b3943;
				line-height: 1.3;
			}

			#status-progress,
			#status-notice {
				display: none;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas">
			Seu navegador não suporta o elemento canvas.
		</canvas>

		<noscript>É necessário habilitar JavaScript para jogar.</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
			const GODOT_CONFIG = {"args":[],"canvasResizePolicy":1,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9965768,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
			const GODOT_THREADS_ENABLED = false;
			const engine = new Engine(GODOT_CONFIG);

			(function () {
				const statusOverlay = document.getElementById('status');
				const statusProgress = document.getElementById('status-progress');
				const statusNotice = document.getElementById('status-notice');

				let initializing = true;
				let statusMode = '';

				function setStatusMode(mode) {
					if (statusMode === mode || !initializing) {
						return;
					}
					if (mode === 'hidden') {
						statusOverlay.remove();
						initializing = false;
						return;
					}
					statusOverlay.style.visibility = 'visible';
					statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
					statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
					statusMode = mode;
				}

				function setStatusNotice(text) {
					statusNotice.replaceChildren();
					text.split('\n').forEach((line) => {
						statusNotice.append(document.createTextNode(line), document.createElement('br'));
					});
				}

				function displayFailureNotice(error) {
					console.error(error);
					setStatusNotice(error instanceof Error ? error.message : String(error));
					setStatusMode('notice');
					initializing = false;
				}

				const missing = Engine.getMissingFeatures({
					threads: GODOT_THREADS_ENABLED,
				});

				if (missing.length !== 0) {
					displayFailureNotice(
						'Este navegador não oferece os recursos necessários para executar este jogo:\n'
						+ missing.join('\n')
					);
				} else {
					setStatusMode('progress');
					engine.startGame({
						'onProgress': function (current, total) {
							if (current > 0 && total > 0) {
								statusProgress.value = current;
								statusProgress.max = total;
							} else {
								statusProgress.removeAttribute('value');
								statusProgress.removeAttribute('max');
							}
						},
					}).then(() => {
						setStatusMode('hidden');
					}, displayFailureNotice);
				}
			}());
		</script>
	</body>
</html>
